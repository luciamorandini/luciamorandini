<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="t d">
  <title id="t">UniMaps</title>
  <desc id="d">Accessible indoor navigation for the UNSL campus. A graph where the highlighted route passes through a ramp and an elevator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f0c1d"/>
      <stop offset="1" stop-color="#6d1530"/>
    </linearGradient>
  </defs>
  <rect width="960" height="340" rx="10" fill="url(#bg)"/>

  <!-- text -->
  <text x="48" y="92" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="52" fill="#ffffff" letter-spacing="1">UniMaps</text>
  <rect x="48" y="112" width="64" height="2" fill="#e9c9d2"/>
  <text x="48" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#f6e4e9">Accessible indoor navigation</text>
  <text x="48" y="174" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#f6e4e9">for the UNSL campus.</text>
  <g font-family="'Courier New', Courier, monospace" font-size="14" fill="#e9c9d2">
    <text x="48" y="224">pgRouting  ramps, elevators</text>
    <text x="48" y="246">Socket.io  live incidents</text>
    <text x="48" y="268">WCAG 2.2   admin map editor</text>
  </g>

  <!-- graph: all connections -->
  <g stroke="#e9c9d2" stroke-opacity="0.28" stroke-width="2" fill="none">
    <line x1="580" y1="270" x2="640" y2="206"/>
    <line x1="640" y1="206" x2="716" y2="236"/>
    <line x1="640" y1="206" x2="700" y2="140"/>
    <line x1="716" y1="236" x2="800" y2="190"/>
    <line x1="716" y1="236" x2="880" y2="270"/>
    <line x1="700" y1="140" x2="790" y2="96"/>
    <line x1="790" y1="96" x2="880" y2="150"/>
    <line x1="800" y1="190" x2="880" y2="150"/>
    <line x1="800" y1="190" x2="880" y2="270"/>
    <line x1="640" y1="206" x2="600" y2="110"/>
    <line x1="600" y1="110" x2="700" y2="140"/>
    <line x1="600" y1="110" x2="664" y2="56"/>
    <line x1="664" y1="56" x2="790" y2="96"/>
  </g>
  <!-- inaccessible shortcut (stairs) -->
  <line x1="700" y1="140" x2="800" y2="190" stroke="#e9c9d2" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>

  <!-- accessible route -->
  <polyline points="580,270 640,206 716,236 800,190 880,150" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- nodes -->
  <g fill="#3f0c1d" stroke="#e9c9d2" stroke-opacity="0.5" stroke-width="2">
    <circle cx="700" cy="140" r="7"/>
    <circle cx="790" cy="96" r="7"/>
    <circle cx="880" cy="270" r="7"/>
    <circle cx="600" cy="110" r="7"/>
    <circle cx="664" cy="56" r="7"/>
  </g>
  <g fill="#ffffff">
    <circle cx="640" cy="206" r="8"/>
    <circle cx="716" cy="236" r="8"/>
    <circle cx="800" cy="190" r="8"/>
    <circle cx="580" cy="270" r="11"/>
    <circle cx="880" cy="150" r="11"/>
  </g>
  <circle cx="580" cy="270" r="4" fill="#6d1530"/>
  <circle cx="880" cy="150" r="4" fill="#6d1530"/>

</svg>
